spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tourismdata_contest?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

external:
  tourapi:
    base-url: https://apis.data.go.kr/B551011/KorService2
    service-key: ${TOURAPI_SERVICE_KEY:}
  kakao-local:
    base-url: https://dapi.kakao.com/v2/local
    rest-api-key: ${KAKAO_REST_API_KEY:}

logging:
  level:
    com.tourismdata.contest: DEBUG
